repos:
  - repo: local
    hooks:
    - id: hatch-fmt
      name: hatch-fmt
      entry: hatch fmt
      language: python
      types_or: [python, pyi, jupyter]
      stages: [pre-commit]

    - id: mypy
      name: mypy
      entry: hatch run types:check
      language: python
      files: \.py$
      types: [python]
      stages: [pre-commit]

    - id: jupyter-nb-clear-output
      name: jupyter-nb-clear-output
      files: \.ipynb$
      stages: [pre-commit]
      language: python
      types: [jupyter]
      entry: jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
