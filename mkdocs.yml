site_name: EVASPA Documentation

theme:
  name: "material"
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference

plugins:
  - autorefs
  - search
  - gen-files:
      scripts:
        - hooks/gen_ref_nav.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]  # search packages in the src folder
          options:
            show_submodules: true
            docstring_style: numpy
            docstring_section_style: list
            filters:
              - "!^_"
              - "^__init__$"
            heading_level: 1
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_inheritance_diagram: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            unwrap_annotated: true
  - mkdocs-jupyter:
      execute: true
      include: ["*.ipynb"]
      ignore: ["raqrs/notebooks/*.ipynb"]
      remove_tag_config:
        remove_input_tags:
          - hide_code

markdown_extensions:
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - css/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css
  - css/jupyter.css

nav:
  - Home: 
    - Overview: index.md
    - Getting started: getting_started.md
    - Algorithm overview: algorithm.md
  - Usage: 
    - Overview: usage.md
    - Configuration:
      - Processing steps: configuration.md
      - EF model: ef_model.md
  - Dev: dev.md
  - Tutorials:
    - Overview: tutorials.md
    - EVASPA notebook: notebooks/run_evaspa.ipynb
  - API: api/
  - todo.md

